[general]
live_config_reload = true
import = ["~/.config/alacritty/catppuccin-mocha.toml"]

[font]
size = 12

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Extra Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Medium Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Extra Bold Italic"

[window]
decorations = "Full"
startup_mode = "Windowed"

[window.padding]
x = 8
y = 8

[cursor.style]
shape = "Block"
blinking = "Off"

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true

